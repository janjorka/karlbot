@if (challenge !== null) {
  <app-page [fullWidth]="true">
    <span page-title>
      {{challenge.name}}
      <app-challenge-status class="status" [submissionsInfo]="challenge.submissionsInfo"></app-challenge-status>
    </span>
    <div class="content">
      <div class="assignment">
        <div class="difficulty mat-subtitle-1">
          <app-challenge-difficulty [difficulty]="challenge.difficulty"></app-challenge-difficulty>
        </div>
        <app-markdown-view [source]="challenge.description"></app-markdown-view>
        @if (challengeTestCases.length !== 0) {
          <h2>Examples</h2>
        }
        <div class="test-cases">
          @for (testCase of challengeTestCases; track testCase) {
            <div class="test-case">
              <div class="test-case-container-outer">
                <div class="test-case-container-inner">
                  <app-town-view [town]="testCase.inputTown" appTownViewFitContain class="test-case-input mat-elevation-z2"></app-town-view>
                </div>
              </div>
              <div class="test-case-container-outer test-case-container-outer-arrow">
                <div class="test-case-container-inner test-case-container-inner-arrow">
                  <mat-icon class="test-case-arrow">arrow_right_alt</mat-icon>
                </div>
              </div>
              <div class="test-case-container-outer">
                <div class="test-case-container-inner">
                  <app-town-view [town]="testCase.outputTown" appTownViewFitContain class="test-case-output mat-elevation-z2"></app-town-view>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
      <div class="submissions">
        <h2>Submissions</h2>
        <button mat-flat-button color="primary" (click)="onSubmitProject()">
          <mat-icon>add</mat-icon>
          Submit Project
        </button>
        <div class="submission-items">
          @for (challengeSubmission of challengeSubmissions; track challengeSubmission) {
            <app-challenge-submission [challengeSubmission]="challengeSubmission"></app-challenge-submission>
          }
        </div>
      </div>
    </div>
  </app-page>
}
