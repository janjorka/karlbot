<mat-nav-list>
  @for (savedProject of savedProjects; track savedProject) {
    <mat-list-item (click)="onSelect(savedProject)">
      <div matListItemTitle>{{savedProject.project.name}}</div>
      <div matListItemLine>{{savedProject.modified | appDateAgo}}</div>
    </mat-list-item>
  }
</mat-nav-list>
